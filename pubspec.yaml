name: rafiq_app
description: "Rafiq - a free waqf app for Quran memorization and live tajweed correction, fully on-device."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  record: ^5.1.2
  permission_handler: ^11.3.1
  sherpa_onnx: ^1.10.35

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
